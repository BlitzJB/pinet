# Pinet coordinator nginx site.
#
# `install.sh` substitutes __DOMAIN__ and writes this to
# /etc/nginx/sites-available/pinet. Then run certbot to add TLS:
#
#   certbot --nginx -d <domain> --redirect
#
# If a certificate already exists, install.sh leaves the certbot-managed vhost
# untouched.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Long timeouts: a remote agent turn can run for a long time.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
