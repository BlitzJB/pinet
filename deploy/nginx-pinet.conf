# Pinet coordinator nginx site.
#
# Terminates TLS (added by certbot) and reverse-proxies HTTP + WebSocket to the
# coordinator on 127.0.0.1:8787. `$connection_upgrade` comes from
# deploy/nginx-pinet-upgrade.conf.

server {
    listen 80;
    listen [::]:80;
    server_name pineit.bharathi.fi pinet.bharathi.fi;

    # Long timeouts: a remote agent turn can run for a long time.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
